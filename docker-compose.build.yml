# Build the image locally (on the NAS or a dev machine) instead of pulling it.
#   docker compose -f docker-compose.build.yml up -d --build
services:
  jftools:
    build: .
    image: ghcr.io/opheophe/jftools:local
    container_name: jftools
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
    ports:
      - "8099:8099"
    volumes:
      - /Volume1/public/Docker/Configs/JFTools:/data
