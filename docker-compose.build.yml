# Build the image locally (on the NAS or a dev machine) instead of pulling it.
# Same service definition as docker-compose.yml, but with `build: .`.
#
#   docker compose -f docker-compose.build.yml up -d --build
services:
  jftools:
    build: .
    image: ghcr.io/opheophe/jftools:local
    container_name: jftools
    restart: unless-stopped
    env_file: .env
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      JFTOOLS_DATA_DIR: /data
    ports:
      - "8099:8099"
    volumes:
      - ${JFTOOLS_DATA_PATH:-./data}:/data
