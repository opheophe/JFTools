<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1537"/>
      <stop offset="50%" stop-color="#0F0C20"/>
      <stop offset="100%" stop-color="#080511"/>
    </linearGradient>

    <!-- Outer Glow Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AA5CC3"/>
      <stop offset="50%" stop-color="#00A4DC"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>

    <!-- Server Chassis & Blade Gradient -->
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A244D"/>
      <stop offset="100%" stop-color="#15102A"/>
    </linearGradient>

    <!-- Jellyfin Dynamic Accent Gradient -->
    <linearGradient id="jellyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A4DC"/>
      <stop offset="50%" stop-color="#7B52C4"/>
      <stop offset="100%" stop-color="#B741B8"/>
    </linearGradient>

    <!-- Play Symbol Soft Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Outer Circle (Clip Mask for Round Icon) -->
  <g>
    <!-- Main Background Circle -->
    <circle cx="256" cy="256" r="240" fill="url(#bgGrad)"/>

    <!-- Subtle Outer Border/Glow Ring -->
    <circle cx="256" cy="256" r="238" fill="none" stroke="url(#ringGrad)" stroke-width="4" opacity="0.8"/>
    <circle cx="256" cy="256" r="230" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.1"/>

    <!-- Decorative Wavelength Rings (Media Theme) -->
    <circle cx="256" cy="256" r="190" fill="none" stroke="#00A4DC" stroke-width="2" stroke-dasharray="6 12" opacity="0.25"/>
    <circle cx="256" cy="256" r="210" fill="none" stroke="#AA5CC3" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.2"/>

    <!-- CENTRAL GRAPHIC: Server Rack Stack with Jellyfin Wave Overlay -->
    <g transform="translate(0, -10)">
      <!-- Server Unit 1 (Top) -->
      <rect x="136" y="150" width="240" height="44" rx="10" fill="url(#serverGrad)" stroke="#3D3468" stroke-width="2"/>
      <circle cx="166" cy="172" r="5" fill="#00D2FF"/>
      <circle cx="184" cy="172" r="5" fill="#AA5CC3"/>
      <line x1="210" y1="172" x2="346" y2="172" stroke="#3D3468" stroke-width="4" stroke-linecap="round"/>

      <!-- Server Unit 2 (Middle) -->
      <rect x="136" y="206" width="240" height="44" rx="10" fill="url(#serverGrad)" stroke="#3D3468" stroke-width="2"/>
      <circle cx="166" cy="228" r="5" fill="#00D2FF"/>
      <circle cx="184" cy="228" r="5" fill="#00A4DC"/>
      <line x1="210" y1="228" x2="346" y2="228" stroke="#3D3468" stroke-width="4" stroke-linecap="round"/>

      <!-- Server Unit 3 (Bottom) -->
      <rect x="136" y="262" width="240" height="44" rx="10" fill="url(#serverGrad)" stroke="#3D3468" stroke-width="2"/>
      <circle cx="166" cy="284" r="5" fill="#00D2FF"/>
      <circle cx="184" cy="284" r="5" fill="#AA5CC3"/>
      <line x1="210" y1="284" x2="346" y2="284" stroke="#3D3468" stroke-width="4" stroke-linecap="round"/>

      <!-- Jellyfin Abstract Layers (Fin / Play Emblem) -->
      <g filter="url(#glow)">
        <!-- Outer Shell (Jellyfin Curve) -->
        <path d="M226 140 C 310 140, 360 210, 340 280 C 326 328, 260 338, 226 290 C 200 252, 210 180, 226 140 Z" 
              fill="url(#jellyGrad)" opacity="0.85"/>
        
        <!-- Inner Play Triangle Accent -->
        <path d="M235 185 L305 236 L235 287 Z" fill="#FFFFFF" opacity="0.95"/>
      </g>
    </g>

    <!-- Typography: MedServ -->
    <!-- Curved Path for Text or Clean Centered Text -->
    <text x="256" y="395" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="800" 
          font-size="34" 
          fill="#FFFFFF" 
          text-anchor="middle" 
          letter-spacing="4">
      MED<tspan fill="#00A4DC">SERV</tspan>
    </text>

    <!-- Subtitle / Indicator -->
    <text x="256" y="420" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="500" 
          font-size="12" 
          fill="#AA5CC3" 
          text-anchor="middle" 
          letter-spacing="6" 
          opacity="0.9">
      JELLYFIN TOOLS
    </text>
  </g>
</svg>
