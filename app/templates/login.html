<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JFTools — Login</title>
  <link rel="icon" href="/resources/icon.ico">
  <link rel="icon" type="image/png" href="/resources/icon.png">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-body">
  <main class="login-box">
    <h1 class="brand"><img src="/resources/icon.png" alt="JFTools" class="brand-logo brand-logo-lg"> JFTools</h1>
    <form method="post" action="/login">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      {% if error %}
      <p class="error">{{ error }}</p>
      {% endif %}

      <button type="submit" class="primary">Log in</button>
      <p class="hint">Log in with a Jellyfin admin account (works from anywhere), or with the local password when on your local network.</p>
    </form>
  </main>
</body>
</html>
