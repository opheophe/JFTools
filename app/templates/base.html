<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MedServ{% endblock %}</title>
  <link rel="icon" href="/resources/icon.ico">
  <link rel="icon" type="image/svg+xml" href="/resources/icon.svg">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="{% block bodyclass %}{% endblock %}">
  <header class="topbar">
    <div class="brand"><img src="/resources/icon.svg" alt="MedServ" class="brand-logo"> MedServ</div>
    <nav>
      <a href="/">Current activity</a>
      <a href="/libraries">Libraries</a>
      <a href="/jellyfin-id">Movie Match</a>
      <a href="/users">Users</a>
      <a href="/scheduler">Scheduler</a>
      <a href="/logs">Logs</a>
      <a href="/settings">Settings</a>
      <form method="post" action="/logout" class="inline">
        <button type="submit" class="link">Log out</button>
      </form>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
