<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}JFTools{% endblock %}</title>
  <link rel="icon" href="/resources/icon.ico">
  <link rel="icon" type="image/png" href="/resources/icon.png">
  <link rel="stylesheet" href="/static/app.css?v={{ asset }}">
</head>
<body class="{% block bodyclass %}{% endblock %}">
  <header class="topbar">
    <div class="brand"><img src="/resources/icon.png" alt="JFTools" class="brand-logo"> JFTools</div>
    <nav>
      <a href="/">Current activity</a>
      <a href="/libraries">Libraries</a>
      <a href="/jellyfin-id">Movie Match</a>
      <a href="/search">Search</a>
      <a href="/users" id="nav-users">Users<span class="watch-dot" id="watch-dot" hidden></span></a>
      <a href="/scheduler">Scheduler</a>
      <a href="/logs">Logs</a>
      <a href="/settings">Settings</a>
      <a href="/about" id="nav-about">About<span class="update-dot" id="update-dot" hidden></span></a>
      <form method="post" action="/logout" class="inline">
        <button type="submit" class="link">Log out</button>
      </form>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js?v={{ asset }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
