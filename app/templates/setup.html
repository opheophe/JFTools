<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JFTools — Set up</title>
  <link rel="icon" href="/resources/icon.ico">
  <link rel="icon" type="image/png" href="/resources/icon.png">
  <link rel="stylesheet" href="/static/app.css?v={{ asset }}">
</head>
<body class="login-body">
  <main class="login-box">
    <h1 class="brand"><img src="/resources/icon.png" alt="JFTools" class="brand-logo brand-logo-lg"> JFTools</h1>
    <p class="muted">Welcome! Create the local login for this dashboard.</p>
    <form method="post" action="/setup">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>

      <label for="confirm_password">Confirm password</label>
      <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="8" required>

      {% if error %}
      <p class="error">{{ error }}</p>
      {% endif %}

      <button type="submit" class="primary">Create login</button>
      <p class="hint">This username and password work when connecting from your local network. Jellyfin admin accounts can also log in from anywhere.</p>
    </form>
  </main>
</body>
</html>
