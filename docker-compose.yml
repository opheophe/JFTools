# Pull the prebuilt multi-arch image from GitHub Container Registry.
# Everything else (Jellyfin URL/API key, login, time zone, Radarr/Sonarr) is
# configured on the Settings page after first launch.
services:
  jftools:
    image: ghcr.io/opheophe/jftools:latest
    container_name: jftools
    restart: unless-stopped
    environment:
      # Owner of the data files. Change to match your NAS folder owner
      # (find it over SSH with `id -u` / `id -g`).
      PUID: 1000
      PGID: 1000
    ports:
      - "8099:8099"
    volumes:
      # Change the left side to your data folder on the NAS.
      - /Volume1/public/Docker/Configs/JFTools:/data
